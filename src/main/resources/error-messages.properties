# error-messages.properties
# Validation
30006=Request validation failed. Please check the required fields.

# Network / infrastructure layer \u2014 request never got a response
30007=Unable to reach Razorpay. Please try again later.
30008=Request to Razorpay timed out. Please try again later.
30009=Razorpay service is temporarily unavailable. Please try again later.
30010=Gateway timeout while processing your request.

# Razorpay HTTP error responses \u2014 Razorpay explicitly responded with rejection
30001=Bad request. Please check the request parameters and try again.
30002=Unauthorized access. Please check your credentials and try again.
30003=Failed to create order. Please try again later.
30004=Too many requests. Please wait and try again later.
30005=Razorpay server error. Please try again later.

# Catch-all
30000=An unexpected error occurred. Please try again later.